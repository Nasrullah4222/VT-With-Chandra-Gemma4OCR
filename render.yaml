services:
  - type: web
    name: bn-en-vision-ocr-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: HF_MODEL
        sync: false
      - key: MONGO_URI
        sync: false
